<!DOCTYPE html>
<html>
<head>
  <title>H2 Fueling Log</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }
    h2, h3 {
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }
    .section {
      margin-bottom: 30px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #f9f9f9;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .form-group {
      flex: 1 1 45%;
      min-width: 200px;
    }
    label {
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 5px;
      margin-top: 4px;
      margin-bottom: 12px;
      border: 1px solid #aaa;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007BFF;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>H2 Fueling Log</h2>
  <form id="form">

    <div class="section">
      <h3>Overview</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Date:</label>
          <input type="date" name="Date" required>
        </div>
        <div class="form-group">
          <label>Operator Name:</label>
          <input type="text" name="operatorName" required>
        </div>
        <div class="form-group">
          <label>Ambient Temperature:</label>
          <input type="text" name="ambientTemperature" required>
        </div>
        <div class="form-group">
          <label>Fueling Start Time:</label>
          <input type="time" name="fuelingStartTime" required>
        </div>
        <div class="form-group">
          <label>Fueling End Time:</label>
          <input type="time" name="fuelingEndTime">
        </div>
        <div class="form-group">
          <label>Fueling Amount (Kg):</label>
          <input type="number" name="fuelingAmount">
        </div>
        <div class="form-group">
          <label>Fueling Rate (g/s):</label>
          <input type="number" name="fuelingRate">
        </div>
        <div class="form-group">
          <label>H2 Outlet Pressure (bar):</label>
          <input type="number" name="H2OutletPressure">
        </div>
        <div class="form-group" style="flex: 1 1 100%;">
          <label>H2 Outlet Temperature (°C):</label>
          <input type="number" name="H2OutletTemperature">
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Notes</h3>
      <label>Additional Notes:</label>
      <textarea name="notes" rows="5" placeholder="Anything to add..."></textarea>
    </div>

    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById("form");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const params = new URLSearchParams();
      for (const [key, value] of formData.entries()) {
        params.append(key, value);
      }

      status.innerText = "Submitting...";

      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbw23t7JZfKx67bWPIK80aDhms0H_5QaZkyr6vOET7NNtTtfVnzeji-DUDt1e-oU_BRXfQ/exec", {
          method: "POST",
          body: params
        });

        const text = await response.text();
        console.log("Response:", text);
        status.innerText = "Submitted successfully!";
        form.reset();
      } catch (error) {
        console.error("Submission error:", error);
        status.innerText = "Submission failed.";
      }
    });
  </script>

</body>
</html>
