<!DOCTYPE html>
<html>
<head>
  <title>H2 Fueling Log</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }
    h2, h3 {
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }
    .section {
      margin-bottom: 30px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #f9f9f9;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .form-group {
      flex: 1 1 45%;
      min-width: 200px;
    }
    label {
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 5px;
      margin-top: 4px;
      margin-bottom: 12px;
      border: 1px solid #aaa;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007BFF;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #0056b3;
    }
    @media (max-width: 600px) {
      .form-group {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>

  <h2>H2 Fueling Log</h2>
  <form id="form">

    <div class="section">
      <h3>Overview</h3>
      <div class="form-row">
        <div class="form-group">
          <label for="date">Date:</label>
          <input type="date" id="date" name="Date" required>
        </div>
        <div class="form-group">
          <label for="operatorName">Operator Name:</label>
          <input type="text" id="operatorName" name="operatorName" required>
        </div>
        <div class="form-group">
          <label for="ambientTemperature">Ambient Temperature:</label>
          <input type="text" id="ambientTemperature" name="ambientTemperature" required>
        </div>
        <div class="form-group">
          <label for="fuelingStartTime">Fueling Start Time:</label>
          <input type="time" id="fuelingStartTime" name="fuelingStartTime" required>
        </div>
        <div class="form-group">
          <label for="fuelingEndTime">Fueling End Time:</label>
          <input type="time" id="fuelingEndTime" name="fuelingEndTime">
        </div>
        <div class="form-group">
          <label for="fuelingAmount">Fueling Amount (Kg):</label>
          <input type="number" id="fuelingAmount" name="fuelingAmount" step="0.01" min="0">
        </div>
        <div class="form-group">
          <label for="fuelingRate">Fueling Rate (g/s):</label>
          <input type="number" id="fuelingRate" name="fuelingRate" step="0.1" min="0">
        </div>
        <div class="form-group">
          <label for="H2OutletPressure">H2 Outlet Pressure (bar):</label>
          <input type="number" id="H2OutletPressure" name="H2OutletPressure" step="0.1" min="0">
        </div>
        <div class="form-group" style="flex: 1 1 100%;">
          <label for="H2OutletTemperature">H2 Outlet Temperature (°C):</label>
          <input type="number" id="H2OutletTemperature" name="H2OutletTemperature" step="0.1">
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Notes</h3>
      <label for="notes">Additional Notes:</label>
      <textarea id="notes" name="notes" rows="5" placeholder="Anything to add..."></textarea>
    </div>

    <input type="hidden" name="submissionTimestamp" id="submissionTimestamp">
    <button type="submit">Submit</button>
  </form>

  <script>
    const form = document.getElementById("form");
    const STORAGE_KEY = "h2_fueling_log_draft";

    // Load saved draft
    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        for (const [key, value] of Object.entries(data)) {
          if (form.elements[key]) form.elements[key].value = value;
        }
      }
    });

    // Save form inputs to localStorage
    form.addEventListener("input", () => {
      const data = {};
      for (const element of form.elements) {
        if (element.name) data[element.name] = element.value;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    });

    // Submit logic
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const confirmSubmit = window.confirm("Are you sure you want to submit this driving log?");
      if (!confirmSubmit) return;

      document.getElementById("submissionTimestamp").value = new Date().toISOString();

      // Time validation
      const start = form.elements["fuelingStartTime"].value;
      const end = form.elements["fuelingEndTime"].value;
      if (end && end < start) {
        status.innerText = "End time must be after start time.";
        status.className = "error";
        return;
      }

      status.innerText = "Submitting...";
      status.className = "";
      
      // Record submission timestamp
      const timestamp = new Date().toISOString();

      const formData = new FormData(form);
      const params = new URLSearchParams();
      for (const [key, value] of formData.entries()) {
        params.append(key, value);
      }

      params.append("submissionTimestamp", timestamp);

      // Log values being sent
      console.log("Submitting data:");
      for (const [key, value] of params.entries()) {
        console.log(`${key}: ${value}`);
      }

      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbw23t7JZfKx67bWPIK80aDhms0H_5QaZkyr6vOET7NNtTtfVnzeji-DUDt1e-oU_BRXfQ/exec", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: params.toString()
        });

        const text = await response.text();
        console.log("Response:", text);
        alert("Submitted successfully!\n\nResponse:\n" + text);

        form.reset();
        document.getElementById("submissionTimestamp").value = "";
        localStorage.removeItem(STORAGE_KEY);
      } catch (error) {
        console.error("Submission error:", error);
        alert("Submission failed. Please try again.\n\nError:\n" + error.message);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
