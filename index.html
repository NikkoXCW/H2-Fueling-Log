<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H2 Fueling Log</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .success { color: green; }
    .error { color: red; }
    label { display: block; margin-top: 10px; }
    input, textarea { width: 100%; max-width: 400px; }
    button { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Hydrogen Fueling Log</h1>
  <form id="form">
    <label>Date:
      <input type="date" name="Date">
    </label>
    <label>Operator Name:
      <input type="text" name="operatorName">
    </label>
    <label>Ambient Temperature:
      <input type="number" step="0.1" name="ambientTemperature">
    </label>
    <label>Fueling Start Time:
      <input type="time" name="fuelingStartTime">
    </label>
    <label>Fueling End Time:
      <input type="time" name="fuelingEndTime">
    </label>
    <label>Fueling Amount:
      <input type="number" step="0.01" name="fuelingAmount">
    </label>
    <label>Fueling Rate:
      <input type="number" step="0.01" name="fuelingRate">
    </label>
    <label>H2 Outlet Pressure:
      <input type="number" step="0.1" name="H2OutletPressure">
    </label>
    <label>H2 Outlet Temperature:
      <input type="number" step="0.1" name="H2OutletTemperature">
    </label>
    <label>Notes:
      <textarea name="notes"></textarea>
    </label>

    <!-- Hidden input to record submission timestamp -->
    <input type="hidden" name="submissionTimestamp" id="submissionTimestamp">

    <button type="submit">Submit</button>
    <p id="status"></p>
  </form>

  <script>
    const form = document.getElementById("form");
    const status = document.getElementById("status");
    const STORAGE_KEY = "h2_fueling_log_draft";

    // Load saved draft
    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        for (const [key, value] of Object.entries(data)) {
          if (form.elements[key]) form.elements[key].value = value;
        }
      }
    });

    // Save form inputs to localStorage
    form.addEventListener("input", () => {
      const data = {};
      for (const element of form.elements) {
        if (element.name) data[element.name] = element.value;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    });

    // Submit logic
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!confirm("Submit fueling log?")) return;

      // Record submission timestamp
      const timestamp = new Date().toISOString();
      document.getElementById("submissionTimestamp").value = timestamp;

      const formData = new FormData(form);
      const params = new URLSearchParams();
      for (const [key, value] of formData.entries()) {
        params.append(key, value);
      }

      // Time validation
      const start = form.elements["fuelingStartTime"].value;
      const end = form.elements["fuelingEndTime"].value;
      if (end && end < start) {
        status.innerText = "End time must be after start time.";
        status.className = "error";
        return;
      }

      status.innerText = "Submitting...";
      status.className = "";

      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbw23t7JZfKx67bWPIK80aDhms0H_5QaZkyr6vOET7NNtTtfVnzeji-DUDt1e-oU_BRXfQ/exec", {
          method: "POST",
          body: params
        });

        const text = await response.text();
        console.log("Response:", text);

        if (response.ok) {
          status.innerText = "Submitted successfully!";
          status.className = "success";
          form.reset();
          localStorage.removeItem(STORAGE_KEY);
        } else {
          status.innerText = "Submission failed.";
          status.className = "error";
        }
      } catch (error) {
        console.error("Submission error:", error);
        status.innerText = "Submission failed.";
        status.className = "error";
      }
    });
  </script>
</body>
</html>
